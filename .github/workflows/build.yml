# Builds the Nova's image and uploads it and its recovery zip to the tag's
# release: those two files and nothing else.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true
      build:
        description: Build
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  # The build runs fetched code, so it gets no token that can write.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SUFFIX: ${{ inputs.build == 'debug' && '-debug' || '' }}
    outputs:
      fetched: ${{ steps.sources.outputs.fetched }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Note the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The fetched sources are kept in the "sources" release, one file per set
      # of pins in Scripts/fetch.sh, so they are fetched only after a pin changes.
      - name: Restore the sources
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key=sources-$(grep -E '^[A-Z0-9]+_(URL|TAG|COMMIT)=' Scripts/fetch.sh | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if gh release download sources --pattern "$key.tar" --dir "$RUNNER_TEMP" &&
            tar -xf "$RUNNER_TEMP/$key.tar"; then
            echo "restored $key"
          else
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./build.sh all ${{ inputs.build == 'debug' && '--debug' || '' }}

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abl-build-log
          path: build/abl-build.log

      - name: Pack the sources for later builds
        if: steps.sources.outputs.fetched == 'true'
        run: |
          mkdir store
          tar -cf "store/${{ steps.sources.outputs.key }}.tar" \
            --exclude=build/edk2/.git/openabl-patch --exclude=build/edk2/.git/index \
            build/edk2/.git build/microui build/qtestsign

      - uses: actions/upload-artifact@v7
        if: steps.sources.outputs.fetched == 'true'
        with:
          name: sources
          path: store
          retention-days: 1
          compression-level: 0

      - name: Collect the images
        run: |
          mkdir dist
          cp build/out/abl_signed-SM8550.elf "dist/abl_signed-SM8550$SUFFIX.elf"
          cp build/out/openabl-recovery-flashable-sm8550.zip \
            "dist/openabl-recovery-flashable-sm8550$SUFFIX.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist
          retention-days: 1
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Debug builds go to a pre-release of their own.
      RELEASE: ${{ inputs.build == 'debug' && format('debug-{0}', inputs.tag) || inputs.tag || github.ref_name }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - uses: actions/download-artifact@v8
        if: needs.build.outputs.fetched == 'true'
        with:
          name: sources
          path: store

      - name: Keep the sources for later builds
        if: needs.build.outputs.fetched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view sources > /dev/null 2>&1 ||
            gh release create sources --prerelease --target "$GITHUB_SHA" --title "Build sources" \
              --notes "What Scripts/fetch.sh fetches, kept for CI builds. Not a Portare BIOS release."
          gh release upload sources store/* --clobber

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$RELEASE" = "$TAG" ]; then
            gh release view "$TAG" > /dev/null 2>&1 ||
              gh release create "$TAG" --verify-tag --title "Portare BIOS $TAG" \
                --notes "For the Retroid Pocket Nova: flash abl_signed-SM8550.elf to abl_a and abl_b, or install openabl-recovery-flashable-sm8550.zip from Android's recovery."
          else
            gh release view "$RELEASE" > /dev/null 2>&1 ||
              gh release create "$RELEASE" --prerelease --target "$COMMIT" --title "Portare BIOS $TAG debug" \
                --notes "Debug build of $TAG, unreleased: for testing only."
          fi
          gh release upload "$RELEASE" dist/* --clobber
