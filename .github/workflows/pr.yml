# Debug build of the Nova's image for each pull request, and the host tests.
name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The installer's formatters and partition layouts, checked against
  # fsck.fat, mtools, e2fsck and mke2fs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the checkers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y e2fsprogs dosfstools mtools

      - name: Test
        run: make test TEST_DIR="$RUNNER_TEMP/images"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore the sources
        run: |
          key=sources-$(grep -E '^[A-Z0-9]+_(URL|TAG|COMMIT)=' Scripts/fetch.sh | sha256sum | cut -c1-16)
          if curl -fsSL -o "$RUNNER_TEMP/$key.tar" \
              "https://github.com/${{ github.repository }}/releases/download/sources/$key.tar" &&
            tar -xf "$RUNNER_TEMP/$key.tar"; then
            echo "restored $key"
          fi

      - name: Build
        run: ./build.sh all --debug

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abl-build-log
          path: build/abl-build.log

      - name: Collect the images
        run: |
          mkdir dist
          cp build/out/abl_signed-SM8550.elf dist/abl_signed-SM8550-debug.elf
          cp build/out/openabl-recovery-flashable-sm8550.zip \
            dist/openabl-recovery-flashable-sm8550-debug.zip

      - uses: actions/upload-artifact@v7
        with:
          name: openabl-debug-pr${{ github.event.pull_request.number }}
          path: dist
          retention-days: 14
          compression-level: 0
